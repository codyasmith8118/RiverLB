# Bootstrap only: loopback HTTP, no traffic listeners or managed network objects.
# Create an admin and configure a specific management IP and HTTPS before exposure.
management = "127.0.0.1:18090"
management_protocol = "http"
connect_timeout_ms = 1000
session_timeout_secs = 300
health_interval_secs = 2
max_connections = 4096
virtual_servers = []
