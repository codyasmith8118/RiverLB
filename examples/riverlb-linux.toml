# Local development only. Remote management requires HTTPS; see docs/security-and-database.md.
management = "127.0.0.1:18090"
connect_timeout_ms = 1000
session_timeout_secs = 300
health_interval_secs = 2
max_connections = 4096
virtual_servers = [{ "name" = "web", "listen" = "127.0.0.1:8080", "algorithm" = "round_robin", "members" = ["127.0.0.1:8001", "127.0.0.1:8002"], "persistence" = { "timeout_secs" = 0, "max_entries" = 10000 } }]
network = { "vlans" = [{ "name" = "Linux-VM-VLAN", "interface" = "eth1", "tag" = 11, "role" = "internal" }], "self_ips" = [{ "name" = "Linux-Self-IP", "address" = "192.168.11.69/24", "vlan" = "Linux-VM-VLAN" }], "routes" = [] }
