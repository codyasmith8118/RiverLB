<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · RiverLB</title><script src="/appearance.js"></script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head><body class="login-page"><main class="login-card"><div class="brand">RiverLB<span>TRAFFIC MANAGEMENT</span></div><h1>Sign in</h1><p class="login-intro">Sign in to manage this appliance.</p><form id="login"><label>Username<input name="username" autocomplete="username" required maxlength="128"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><label>Authenticator or recovery code (if enabled)<input name="code" autocomplete="one-time-code" maxlength="64"></label><button type="submit">Sign in</button></form><p id="login-error" role="alert"></p><label class="appearance-control login-appearance"><span>Appearance</span><select data-appearance aria-label="Appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><p class="login-help">Appliance first use: complete console setup. For a repository instance, create an administrator with the <code>riverlb admin</code> command on the server. No default password is provided.</p></main></body></html>
