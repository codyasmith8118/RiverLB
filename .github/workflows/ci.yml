name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iputils-ping libclang-dev node-jsdom openssl
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - name: Check documentation links and candidate packaging
        run: |
          python3 scripts/check-docs.py
          python3 tests/check_docs.py
          python3 tests/build_release.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Check appliance setup, update recovery and service policy
        run: |
          python3 tests/appliance/branding.py
          python3 tests/appliance/installed_branding.py
          python3 tests/appliance/network_defaults.py
          python3 tests/firstboot_ui.py
          python3 tests/appliance/build_workflow.py
          python3 tests/appliance/service_hardening.py
          python3 tests/updates_helper.py
      - name: Check signed update interoperability with private build fixture trust
        run: python3 tests/signed_updates.py
      - run: python3 tests/smoke.py
      - run: python3 tests/configuration.py
      - run: python3 tests/confirmation.py
      - run: python3 tests/persistence.py
      - run: python3 tests/draining.py
      - run: python3 tests/ha_agents.py
      - run: python3 tests/ha_deployment.py
      - run: python3 tests/ha_hyperv_fencing.py
      - run: sudo unshare --net -- python3 tests/ha_failover.py
      - run: sudo unshare --net -- python3 tests/ha_startup_network.py
      - run: python3 tests/security.py
      - run: python3 tests/admin_accounts.py
      - run: python3 tests/auth_release.py
      - run: python3 tests/operations.py
      - run: python3 tests/traffic.py
      - run: python3 tests/udp.py
      - run: python3 tests/lab_tools.py
      - run: python3 tests/monitors.py
      - run: python3 tests/datagram_monitors.py
      - run: python3 tests/certificates.py
      - run: python3 tests/device_certificates.py
      - run: python3 tests/server_tls.py
      - run: python3 tests/priority_capacity.py
      - run: python3 tests/http_rules.py
      - run: python3 tests/http_traffic.py
      - run: python3 tests/rule_catalog.py
      - run: python3 tests/home_features.py
      - run: python3 tests/domain_routing.py
      - run: python3 tests/acme.py
      - run: sudo unshare --net -- bash tests/network_namespace.sh
      - run: sudo unshare --net -- python3 tests/confirmation_network.py
      - run: sudo unshare --net -- python3 tests/two_arm.py
      - run: sudo unshare --net -- python3 tests/two_arm.py --tagged
      - run: sudo unshare --net -- bash tests/nat_namespace.sh
      - run: node --check web/app.js && node --check web/fencing.js && node --check web/login.js && node --check web/statistics.js && node --check web/accounts.js && node --check web/operations.js && node --check web/release.js && node tests/portal.cjs
      - run: node tests/fencing.cjs
      - run: node tests/statistics.cjs
      - run: node --check web/appearance.js && node tests/appearance.cjs
      - run: node tests/operations.cjs
      - run: node tests/release.cjs
      - name: Verify firewall detection under packaged systemd sandboxes
        run: |
          sudo apt-get install -y firewalld
          sudo systemctl start firewalld
          sudo python3 tests/appliance/firewall_sandbox.py --binary target/debug/riverlb
  hyperv-receiver:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fixtures replace Hyper-V cmdlets; these checks never control host VMs.
      - name: Check restricted receiver with PowerShell 7
        shell: pwsh
        run: python tests/ha_hyperv_fencing.py --powershell-smoke (Join-Path $PSHOME 'pwsh.exe')
      - name: Check restricted receiver with Windows PowerShell 5.1
        shell: pwsh
        run: python tests/ha_hyperv_fencing.py --powershell-smoke (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe')
      # Native adapter checks only read namespace security; they never change ACLs.
      - name: Check native WMI adapters with PowerShell 7
        shell: pwsh
        run: python tests/ha_hyperv_fencing.py --powershell-native-wmi-smoke (Join-Path $PSHOME 'pwsh.exe')
      - name: Check native WMI adapters with Windows PowerShell 5.1
        shell: pwsh
        run: python tests/ha_hyperv_fencing.py --powershell-native-wmi-smoke (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe')
