name: Reproducible appliance inputs
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install container builder
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Release unused runner SDK space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Reject invalid inputs
        run: python3 tests/appliance/build_inputs.py
      - name: Build twice with retained inputs and compare
        run: scripts/test-reproducible-build.sh
      - name: Qualify disconnected installation of the second build
        run: |
          RIVERLB_RPM_DIR=dist/reproducibility/second scripts/test-rpm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reproducibility-${{ github.run_id }}
          path: |
            dist/reproducibility/*.log
            dist/reproducibility/comparison.json
            dist/reproducibility/second/build-manifest.json
            dist/reproducibility/second/build-inputs.json
          if-no-files-found: error
          retention-days: 30
