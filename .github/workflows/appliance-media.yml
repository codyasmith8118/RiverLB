name: Appliance ISO candidate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Installation media to build
        type: choice
        options: [installer, image, both]
        default: both
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: iso-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rpm:
    uses: ./.github/workflows/rpm.yml
  media:
    needs: rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y podman
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-${{ github.run_id }}
          path: dist/rpm
      - name: Fetch and verify pinned base media
        run: scripts/fetch-base-iso.py
      - name: Assemble and verify installation media
        env:
          MEDIA_MODE: ${{ inputs.mode }}
        run: |
          iso=$(python3 -c 'import json; print("dist/base/" + json.load(open("appliance/base-media.json"))["filename"])')
          checksum=$(python3 -c 'import json; print(json.load(open("appliance/base-media.json"))["sha256"])')
          case "$MEDIA_MODE" in
            installer|image) modes="$MEDIA_MODE" ;;
            both) modes='installer image' ;;
            *) exit 2 ;;
          esac
          for mode in $modes; do
            scripts/build-iso.sh "$iso" "$checksum" "$mode"
            scripts/test-iso.sh "$mode"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/iso/*.iso
            dist/iso/*.iso.sha256
          if-no-files-found: error
          retention-days: 7
