name: RPM build and qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'CHECK'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_NAME'] == 'v' + version, 'Tag must match Cargo.toml version'
          CHECK
      - name: Install container builder
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build and qualify AlmaLinux packages
        run: |
          scripts/build-rpm.sh
          scripts/test-rpm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/rpm/
          if-no-files-found: error
          retention-days: 14
