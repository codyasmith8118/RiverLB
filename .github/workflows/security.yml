name: Security scans
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check all locked Rust dependencies
        run: python3 scripts/check-dependencies.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Check browser fixture dependencies
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          npm audit --prefix tests
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete reachable history with redacted output
        run: bash scripts/check-secrets.sh
