name: Appliance disk candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    # Dedicated disposable runner, never a deployed appliance. Configure this
    # protected environment to admit trusted release refs before enabling it.
    environment: appliance-build
    runs-on: [self-hosted, linux, x64, riverlb-kvm]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: bios
            image_dir: dist/image
            test_dir: dist/test-vm
          - firmware: uefi
            image_dir: dist/image-uefi
            test_dir: dist/test-vm-uefi
    env:
      RIVERLB_IMAGE_FIRMWARE: ${{ matrix.firmware }}
    steps:
      - uses: actions/checkout@v4
      - name: Check dedicated builder prerequisites
        run: |
          test -r /dev/kvm && test -w /dev/kvm
          command -v podman
          command -v packer
          test ! -e '${{ matrix.image_dir }}'
          test ! -e '${{ matrix.test_dir }}'
      - run: scripts/build-rpm.sh
      - run: scripts/test-rpm.sh
      - run: scripts/fetch-base-iso.py
      - name: Assemble and inspect automatic installation media
        run: |
          iso=$(python3 -c 'import json; print("dist/base/" + json.load(open("appliance/base-media.json"))["filename"])')
          checksum=$(python3 -c 'import json; print(json.load(open("appliance/base-media.json"))["sha256"])')
          scripts/build-iso.sh "$iso" "$checksum" image
          scripts/test-iso.sh image
      - run: scripts/build-image.sh
      - run: scripts/test-image.sh
      - name: Test RiverLB graphical installer and text-console storage safety
        if: matrix.firmware == 'bios'
        run: |
          iso=$(python3 -c 'import json; print("dist/base/" + json.load(open("appliance/base-media.json"))["filename"])')
          checksum=$(python3 -c 'import json; print(json.load(open("appliance/base-media.json"))["sha256"])')
          scripts/build-iso.sh "$iso" "$checksum" installer
          scripts/test-iso.sh installer
          scripts/test-installer.sh
      - name: Upload unconfigured candidates and credential-free test report
        uses: actions/upload-artifact@v4
        with:
          name: appliance-disk-candidate-${{ matrix.firmware }}-${{ github.sha }}
          path: |
            ${{ matrix.image_dir }}/riverlb.qcow2
            ${{ matrix.image_dir }}/riverlb.raw
            ${{ matrix.image_dir }}/efivars.fd
            ${{ matrix.image_dir }}/SHA256SUMS
            ${{ matrix.test_dir }}/report.json
            dist/test-installer-vm/report.json
          if-no-files-found: error
          retention-days: 7
