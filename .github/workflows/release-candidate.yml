name: Application release candidate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: release-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    uses: ./.github/workflows/security.yml
  validation:
    uses: ./.github/workflows/ci.yml
  application:
    needs: [validation, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'CHECK'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_NAME'] == 'v' + version, 'Tag must match Cargo.toml version'
          CHECK
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and check unsigned application archive
        run: |
          scripts/build-release.sh
          python3 tests/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/riverlb-*.tar.gz
            dist/riverlb-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
  rpm:
    needs: [validation, security]
    uses: ./.github/workflows/rpm.yml
